syntax = "proto3";

// 기본 방의 인원 정보. 천 명 규모를 위해 입장·퇴장은 개별 알림 대신 인원 수만 알리고,
// 참가자 목록은 클라이언트가 볼 때만 쪽 단위로 요청한다.
package multiplayer.protocol;
option csharp_namespace = "Multiplayer.Protocol";

// SC_ROOM_USER_COUNT: 인원이 바뀔 때 방 전체에 보낸다.
message SCRoomUserCount {
  uint32 count = 1;
}

// CS_ROOM_USERS: 참가자 목록의 offset 번째부터 한 쪽을 요청한다.
message CSRoomUsers {
  uint32 offset = 1;
}

// SC_ROOM_USERS: 요청한 위치부터 최대 20명(서버 상수)의 닉네임을 돌려준다.
// 쪽을 받는 사이에 사람이 오가면 한 명이 빠지거나 겹칠 수 있다(사용자 선택: offset 방식).
message SCRoomUsers {
  uint32 offset = 1;
  uint32 total = 2;  // 응답 시점의 전체 인원
  repeated string nicknames = 3;
}

// 방 목록의 항목 하나.
message FRoomSummary {
  uint32 room_id = 1;
  string name = 2;
  uint32 user_count = 3;
  uint32 max_users = 4;
}

// CS_ROOM_LIST: 서버에 등록된 채널/방 목록을 요청한다.
message CSRoomList {
}

// SC_ROOM_LIST: 현재 운영 중인 방 목록과 각 방의 인원 수를 돌려준다.
message SCRoomList {
  repeated FRoomSummary rooms = 1;
}

// 방 이동 판정 결과.
enum EJoinRoomResult {
  JOIN_ROOM_NONE = 0;
  JOIN_ROOM_SUCCESS = 1;
  JOIN_ROOM_NOT_FOUND = 2;
  JOIN_ROOM_FULL = 3;
  JOIN_ROOM_ALREADY_IN_ROOM = 4;
  JOIN_ROOM_TRANSFER_IN_PROGRESS = 5;
}

// CS_JOIN_ROOM: 지정한 방으로 이동을 요청한다.
message CSJoinRoom {
  uint32 room_id = 1;
}

// SC_JOIN_ROOM_RESULT: 방 이동 결과와 최종 소속 방 정보.
message SCJoinRoomResult {
  EJoinRoomResult result = 1;
  uint32 room_id = 2;
  uint32 user_count = 3;
}

// CS_PING: 유휴 연결 유지 및 왕복 지연(RTT) 측정용 하트비트 요청.
message CSPing {
  uint64 client_time_ms = 1;
}

// SC_PONG: CS_PING에 대한 즉시 응답.
message SCPong {
  uint64 client_time_ms = 1;
}
