services:
  mysql:
    image: mysql:8.4
    container_name: multiserver-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: multiserver_root_dev_pw
      MYSQL_DATABASE: multiserver
      MYSQL_USER: multiserver
      MYSQL_PASSWORD: multiserver_dev_pw
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs
      - --max-connections=200
    volumes:
      - multiserver_mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "multiserver", "-pmultiserver_dev_pw"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  multiserver_mysql_data:
